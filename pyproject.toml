[project]
name = "obsidian-librarian"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Cotidie", email = "daily142857@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "click>=8.4.1",
    "lancedb>=0.33.0",
    "mcp>=1.27.2",
    "numpy>=2.4.6",
    "pyarrow>=24.0.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "voyageai>=0.4.0",
]

[project.scripts]
vault-search = "obsidian_librarian.cli:main"
obsidian-librarian = "obsidian_librarian.mcp_server:run"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
